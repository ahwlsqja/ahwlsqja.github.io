<h1>시나리오 스테퍼 예시</h1>
<p>가상의 작업 중개 구조로 만든 동작 예시입니다. 배포하지 않는 파일입니다.</p>

<figure class="dg scn" id="scn-demo" data-step-ms="1400" data-scenarios='[{"id":"normal","label":"정상 흐름","steps":[{"ok":["n-client","e-req"],"t":["요청자가 브로커에 작업을 요청합니다.","요청을 한 곳으로 모아야 배정과 기록 순서를 지킬 수 있습니다.","이 단계에서 끊기면 요청자가 오류를 받고 다시 시도합니다."]},{"ok":["n-broker","e-store","n-log"],"t":["브로커가 요청 키를 기록부에 먼저 적습니다.","배정보다 기록을 앞에 둬야 재시도를 알아볼 수 있습니다.","기록에 실패하면 배정하지 않고 요청을 거절합니다."]},{"ok":["e-assign","n-prov"],"t":["브로커가 프로바이더에 작업을 배정합니다.","실행은 프로바이더가 맡고 브로커는 상태만 추적합니다.","배정이 거절되면 다른 프로바이더를 고릅니다."]},{"ok":["e-hb"],"t":["프로바이더가 주기마다 heartbeat를 보냅니다.","살아 있다는 신호를 받아야 작업을 계속 맡길 수 있습니다.","신호가 끊기면 다음 시나리오처럼 격리합니다."]},{"ok":["e-escrow","n-escrow"],"t":["작업이 끝나면 정산소가 예치금을 정산합니다.","끝난 만큼만 지급해야 양쪽 모두 손해가 없습니다.","정산이 실패하면 기록부 기준으로 다시 정산합니다."]}]},{"id":"hb","label":"heartbeat 끊김","steps":[{"ok":["n-client","e-req","n-broker","e-assign","n-prov"],"t":["요청이 배정되어 프로바이더가 작업 중입니다.","정상 흐름과 같은 길이므로 먼저 이 상태를 기준으로 삼습니다.","여기까지는 아직 아무 문제가 없습니다."]},{"ok":["e-hb"],"t":["프로바이더가 heartbeat를 계속 보냅니다.","주기 안에 신호가 오는 동안은 정상으로 봅니다.","신호가 늦으면 다음 단계로 넘어갑니다."]},{"fail":["e-hb","n-prov"],"t":["heartbeat가 끊겨 프로바이더를 의심합니다.","한 번 늦은 것만으로 판단하지 않고 끊김이 이어질 때 실패로 봅니다.","끊김이 이어지면 격리합니다."]},{"fail":["e-isolate","n-iso"],"t":["브로커가 프로바이더를 격리 목록에 올립니다.","격리하면 새 작업이 그 프로바이더로 가지 않습니다.","격리된 뒤에도 돌아오면 확인 후 목록에서 뺄 수 있습니다."]},{"recover":["e-escrow","n-escrow"],"t":["정산소가 남은 예치금을 요청자에게 돌려줍니다.","실행하지 못한 작업에는 값을 치르지 않게 하는 보상 경로입니다.","환불에 실패하면 기록부를 기준으로 다시 시도합니다."]}]},{"id":"dup","label":"같은 요청 두 번","steps":[{"ok":["n-client","e-req","n-broker","e-store","n-log"],"t":["첫 요청이 도착해 요청 키가 기록부에 남습니다.","같은 키를 한 번만 처리하려면 먼저 키를 남겨야 합니다.","기록하지 못하면 요청을 처리하지 않습니다."]},{"ok":["e-assign","n-prov"],"t":["첫 요청이 프로바이더에 배정되어 처리됩니다.","정상 흐름과 같은 길입니다.","이 처리는 한 번만 일어납니다."]},{"on":["e-dup"],"t":["응답이 늦자 요청자가 같은 키로 다시 요청합니다.","네트워크 오류가 나면 요청자는 결과를 몰라 재시도할 수밖에 없습니다.","재시도가 새 작업이 되면 이중 배정이 생깁니다."]},{"ok":["n-log"],"t":["브로커가 기록부에서 같은 키를 찾습니다.","키가 이미 있으면 새 요청이 아니라 재시도로 판단합니다.","찾지 못하면 새 요청으로 처리합니다."]},{"recover":["e-cached"],"t":["브로커가 저장된 응답을 그대로 돌려줍니다.","같은 요청에는 같은 결과를 줘야 재시도가 안전합니다.","새 배정과 새 결제는 일어나지 않습니다."]}]}]'>
  <figcaption><span class="n">그림 1</span>작업 요청이 처리되는 길과 장애 시나리오</figcaption>

</svg>
